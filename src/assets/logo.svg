<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="100%" height="100%">
  <defs>
    <linearGradient id="etqanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#d97706" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Group for Logo Icon -->
  <g transform="translate(10, 10)">
    <!-- Base Badge Hexagon/Shield -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#etqanGrad)" filter="url(#subtleGlow)" />
    
    <!-- Open Book Pages Symbol -->
    <path d="M12 44 C20 40 28 41 30 46 C32 41 40 40 48 44 L48 22 C40 18 32 19 30 24 C28 19 20 18 12 22 Z" fill="#ffffff" opacity="0.95" />
    <path d="M30 24 L30 46" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Spark / Excellence Star -->
    <circle cx="30" cy="14" r="3.5" fill="#fef3c7" />
    <path d="M30 8 L30 12 M30 16 L30 20 M25 14 L29 14 M31 14 L35 14" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Typography / Brand Name -->
  <g transform="translate(85, 46)">
    <text font-family="'Tajawal', 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" fill="#2d1e12" letter-spacing="0">
      إتـقـان
    </text>
  </g>
  <g transform="translate(85, 64)">
    <text font-family="'Tajawal', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#d97706" letter-spacing="0.5">
      المنصة التعليمية للكراسات والملفات
    </text>
  </g>
</svg>
